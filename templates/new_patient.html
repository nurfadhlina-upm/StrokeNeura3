{% extends "base.html" %}
{% block title %}New Patient — StrokeCare{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <h1 class="page-title">Register New Patient</h1>
    <p class="page-sub">Enter patient demographics and admission details</p>
  </div>
  <a href="/" class="btn btn-outline"><i data-lucide="arrow-left"></i> Back</a>
</div>

<form method="POST" action="/patient/new" class="form-card">
  <div class="form-section">
    <h3 class="form-section-title"><i data-lucide="user"></i> Personal Information</h3>
    <div class="form-grid">

      <div class="form-group span-2">
        <label>Full Name <span class="required">*</span></label>
        <input type="text" name="name" placeholder="e.g. Ahmad bin Zulkifli" required class="form-control"/>
      </div>

      <div class="form-group">
        <label>Age <span class="required">*</span></label>
        <input type="number" name="age" min="1" max="130" placeholder="e.g. 65" required class="form-control"/>
      </div>

      <div class="form-group">
        <label>Gender <span class="required">*</span></label>
        <select name="gender" required class="form-control">
          <option value="">— Select —</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>IC / Passport Number</label>
        <input type="text" name="ic_number" placeholder="e.g. 610312-14-5678" class="form-control"/>
      </div>

      <div class="form-group">
        <label>Contact Number</label>
        <input type="text" name="contact" placeholder="e.g. 012-3456789" class="form-control"/>
      </div>

      <div class="form-group span-2">
        <label>Address</label>
        <textarea name="address" rows="2" placeholder="Home address…" class="form-control"></textarea>
      </div>

      <div class="form-group">
        <label>Admission Date <span class="required">*</span></label>
        <input type="date" name="admission_date" required class="form-control" id="admission-date"/>
      </div>

    </div>
  </div>

  <div class="form-actions">
    <a href="/" class="btn btn-outline">Cancel</a>
    <button type="submit" class="btn btn-primary"><i data-lucide="save"></i> Register Patient</button>
  </div>
</form>

<script>
  // Set today's date as default
  document.getElementById('admission-date').valueAsDate = new Date();
</script>
{% endblock %}
